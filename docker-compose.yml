services:
  db:
    image: postgres:17-alpine
    container_name: unityaid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unityaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unityaid}
      POSTGRES_DB: ${POSTGRES_DB:-unityaid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - unityaid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unityaid} -d ${POSTGRES_DB:-unityaid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./unityaid-back
      dockerfile: Dockerfile.prod
    container_name: unityaid-back
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-unityaid}:${POSTGRES_PASSWORD:-unityaid}@db:5432/${POSTGRES_DB:-unityaid}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      RUN_SEEDS: ${RUN_SEEDS:-true}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./unityaid-back/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./unityaid-front
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: unityaid-front
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  unityaid_postgres_data:
